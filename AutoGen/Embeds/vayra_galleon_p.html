	<meta content="This Galleon is worn and battlescarred, but beneath the deep gouges on its armor belts and the plasma burns on its hull it bears the personal colors of a dread pirate lord. Extensively refit for battle, this pirate dreadnought carries enough firepower to reduce an orbital station singlehandedly - and has cargo holds enough to carry away the spoils of such a raid on its own. Truly a fearsome vessel, the Flying Dutchman stands as a monument to the endless ingenuity of mankind when it comes to committing violence against one another.
A gigantic and extremely well-defended merchant vessel, acting as a mobile command center, financial institution, tax collector, bazaar, and corporate luxury liner for executives of the Rimward Venture Trading Company. Constructed to collect extracted wealth from outlying colonies in the furthest most dangerous reaches of the sector and return it safely home to the Company's shareholders, the Galleon's nigh-impregnable armored belts and heavy weaponry are proof against scavengers, pirates, and more powerful threats alike." property="og:description" />
