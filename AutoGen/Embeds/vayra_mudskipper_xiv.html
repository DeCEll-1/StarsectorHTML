	<!-- description -->
	<meta content="A series of ill-advised modifications have been made to militarize this normally-harmless hull beyond even the standard set by the ubiquitous-among-pirates Mudskipper Mk.II. The hull has been painted in a facsimile of Domain Fourteenth Battlegroup naval colors so poorly done that it simply has to be mockery, and the frontal large hardpoint has been converted into a (mostly) functional turret in an impressive display of jury-rigging. Several incredibly unlikely kill-marking silhouettes are emblazoned brightly on the hull, including an Astral-class supercarrier and a pair of Paragon-class battleships.
Most commonly used as interplanetary ferry, the Mudskipper is indeed interstellar-capable. The ship has no built-in shield generator so must rely on its durable - for a civilian craft - armor to protect passengers and cargo. There is little hope for the Mudskipper in combat, but it is generally equipped with a rear-facing turret to foil attacks by the ever-popular Salamander missile." property="og:description" />
