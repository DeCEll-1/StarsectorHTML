	<meta content="
Most ships are modified beyond the base design spec, specializing in a particular role or just squeezing some extra performance out of a hull. On rare occasion, a ship will undergo radical modifications to become a so-called Mod-ship, bearing unique characteristics and heightened capabilities. These Mod-ships often gain reputations unto their own, becoming coveted prizes for the Sector's elite. As the story goes, an enterprising starship engineer aboard a Sunder-class destroyer became the sole survivor of a battle after both fleets completely annihilated each other. Trapped aboard a disabled ship with no chance of rescue, she managed to get the burn drives back up and running on her own and crawled back to port. Having inherited the credit funds of both fleets in her ill-fated battle, she opted to fully overhaul the ship that saved her life, rearranging compromised systems and optimizing the damaged superstructure. The result is the Fracture, a modified Sunder-class that features heavy missile launchers." property="og:description" />
