The Spade is a light hauler and mining launch that, despite an extremely competitive pricing scheme and generally nondemanding support profile, never managed to achieve the same success and ubiquity of its competitors - namely the Hermes, Kite, Pegasus, and eventually the Mercury. The Spade's sole redeeming feature is that with generous machining tolerances and so little internal volume devoted to crew, fuel, or cargo space, customization of the hull and weapon mounts is surprisingly easy. Often criticized for its weak engines, unshielded and essentially unarmored hull, and barely present hardpoint layout, it nonetheless remains in service in the Persean Sector... Most often in the hands of short-haul asteroid miners, in-system smugglers, and extremely down-on-their-luck scavengers or tramp freighter captains. " property="og:description" />
