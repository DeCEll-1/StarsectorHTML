	<!-- description -->
	<meta content="At first glance this modified Colossus freighter sporting Hegemony livery appears to be a militarized auxiliary, or perhaps even a surviving logistics vessel from the historic Fourteenth Battlegroup. Upon closer inspection however the ships disreputable provenance is clear: The stripes are haphazard, the paint faded, the exterior hull plating crudely welded in place - at least where it hasn't been cut away to provide room for jury-rigged weapon mounts - and to top it all off, somebody has painted 'NOT PIRATES' on one side of the hull and 'TECHNICALLY WE'RE PRIVATEERS' on the other in gigantic, clumsy block capitals.
The Colossus was first adapted for war by Pather militants, but enterprising pirates soon followed their lead. A similarly haphazard process sees most cargo decks collapsed and re-welded to form thick armor dotted with numerous weapons emplacements. The primary cargo bay was left open, however, and converted into an ersatz fighter launch bay with the addition of a micro civilian forge-vat intended for the manufacture of machine parts hacked to accept fighter LPC chips. The forge is poorly integrated with the hull's base power system, resulting in unreliable overall performance." property="og:description" />
