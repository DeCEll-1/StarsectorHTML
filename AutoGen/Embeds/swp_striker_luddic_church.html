	<meta content="The Luddic Church prefer a heavily modified variant of the Striker, which greatly emphasizes its namesake: striking fast and hard with waves of missiles.
Favored by the bold, the Striker is a cheap light destroyer with a basic array of forward-facing weapons. Typically seen as a more accessible alternative to the Shrike, making it popular with the Luddic Church. Comes standard with a large internal magazine for missile ordnance.

The Striker actually began its life as an unarmed exploration hull, filled to the brim with sensors, spacious cargo holds and advanced propulsion systems. Over many cycles, its original manufacturer gradually militarized the design into the armed and armored rocket we see today - a good fit for the Persean Sector." property="og:description" />
